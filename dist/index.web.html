<!DOCTYPE html>
<html>
	<head>
		<base href="/dist/" />
		<meta http-equiv="content-type" content="text/html; charset=utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PlanStar Web</title>

		<style type="text/css">
			/* PlanStar 启动徽标 —— 聚光成星（star ignition）
			   品牌四角星 + 星轨环（协作节点绕行）+ 呼吸光晕 + 星芒闪烁；退场为星爆绽放。
			   全部选择器限定在 #bubble-loader 内，独立于 legacy.css 与页面其它 .bubble 元素。
			   保留契约：id bubble-loader、.small（多视图 32px）、.inflate（app.tsx 退场，300ms transitionDuration）。 */
			#bubble-loader {
				position: absolute; width: 154px; height: 154px; left: 50%; top: 50%; transform: translate3d(-50%, -50%, 0); z-index: 10001;
				display: flex; align-items: center; justify-content: center; transition: transform, opacity cubic-bezier(0.4, 0, 0.2, 1) 1s;
				transform-origin: 50% 50%; will-change: transform, opacity;
			}
			#bubble-loader.small { width: 32px; height: 32px; }
			#bubble-loader .stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

			/* 呼吸光晕 */
			#bubble-loader .glow {
				position: absolute; inset: -30%; border-radius: 50%;
				background: radial-gradient(circle at 50% 50%, rgba(124,92,255,0.28) 0%, rgba(61,123,255,0.14) 34%, rgba(240,163,94,0.06) 56%, transparent 72%);
				filter: blur(2px); animation: psGlow 3.2s ease-in-out infinite;
			}

			/* 星轨环 + 绕行协作节点 */
			#bubble-loader .ring { position: absolute; width: 92%; height: 92%; border-radius: 50%; border: 1px solid rgba(24,21,16,0.10); animation: psOrbit 9s linear infinite; }
			#bubble-loader .ring .node { position: absolute; width: 7%; height: 7%; border-radius: 50%; box-shadow: 0 0 6px rgba(124,92,255,0.5); }
			#bubble-loader .ring .node.a { top: -3.5%; left: 46.5%; background: linear-gradient(135deg, #3d7bff, #7c5cff); }
			#bubble-loader .ring .node.b { bottom: -3.5%; left: 46.5%; background: linear-gradient(135deg, #f0a35e, #7c5cff); }
			#bubble-loader .ring .node.c { top: 46.5%; right: -3.5%; width: 5%; height: 5%; background: linear-gradient(135deg, #3d7bff, #f0a35e); }

			/* 核心四角星 */
			#bubble-loader .core { position: relative; width: 46%; height: 46%; overflow: visible; animation: psBreathe 2.8s ease-in-out infinite; filter: drop-shadow(0 2px 10px rgba(124,92,255,0.35)); }
			#bubble-loader .core path { fill: url(#psBootGrad); }

			/* 星芒（十字闪光） */
			#bubble-loader .spark { position: absolute; width: 120%; height: 120%; overflow: visible; animation: psTwinkle 3.2s ease-in-out infinite; }
			#bubble-loader .spark path { stroke: rgba(124,92,255,0.55); stroke-width: 1.5; stroke-linecap: round; fill: none; }

			/* 退场：星爆绽放 */
			#bubble-loader.inflate { transform: translate3d(-50%, -50%, 0) scale3d(1.9, 1.9, 1); opacity: 0; }
			#bubble-loader.inflate .stage > * { animation-play-state: paused; }
			#bubble-loader.inflate .glow { transform: scale(1.6); }

			html.themeDark #bubble-loader .ring { border-color: rgba(255,255,255,0.12); }
			html.themeDark #bubble-loader .glow { background: radial-gradient(circle at 50% 50%, rgba(124,92,255,0.36) 0%, rgba(61,123,255,0.18) 34%, rgba(240,163,94,0.08) 58%, transparent 74%); }
			html.themeDark #bubble-loader .core { filter: drop-shadow(0 0 14px rgba(124,92,255,0.55)); }
			html.themeDark #bubble-loader .spark path { stroke: rgba(255,255,255,0.8); }

			@keyframes psGlow { 0%, 100% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.08); } }
			@keyframes psOrbit { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
			@keyframes psBreathe { 0%, 100% { transform: scale(0.9) rotate(-4deg); } 50% { transform: scale(1.06) rotate(4deg); } }
			@keyframes psTwinkle { 0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); } 45%, 55% { opacity: 0.9; transform: scale(1) rotate(45deg); } }

			@media (prefers-reduced-motion: reduce) {
				#bubble-loader .glow, #bubble-loader .ring, #bubble-loader .core, #bubble-loader .spark { animation: none; }
				#bubble-loader .spark { opacity: 0; }
			}

			/* Web mode indicator */
			.web-mode-indicator {
				position: fixed;
				bottom: 10px;
				right: 10px;
				padding: 4px 8px;
				background: rgba(0, 0, 0, 0.6);
				color: #fff;
				font-size: 11px;
				border-radius: 4px;
				z-index: 99999;
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}
		</style>
	</head>
	<body>
		<div id="bubble-loader">
			<div class="stage">
				<div class="glow"></div>
				<div class="ring"><span class="node a"></span><span class="node b"></span><span class="node c"></span></div>
				<svg class="spark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6 L50 94 M6 50 L94 50" /></svg>
				<svg class="core" viewBox="0 0 100 100" aria-hidden="true">
					<defs>
						<linearGradient id="psBootGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
							<stop stop-color="#3d7bff" />
							<stop offset=".52" stop-color="#7c5cff" />
							<stop offset="1" stop-color="#f0a35e" />
						</linearGradient>
					</defs>
					<path d="M50 4 C53 31 69 47 96 50 C69 53 53 69 50 96 C47 69 31 53 4 50 C31 47 47 31 50 4 Z" />
				</svg>
			</div>
		</div>

		<div id="root"></div>

		<div class="web-mode-indicator">Web Mode</div>

		<script type="text/javascript">
			// Initialize theme based on user preference
			(function() {
				var savedTheme = localStorage.getItem('anytype_config');
				var theme = '';

				try {
					if (savedTheme) {
						var config = JSON.parse(savedTheme);
						theme = config.theme || '';
					}
				} catch (e) {}

				if (!theme) {
					theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}

				function ucFirst(str) {
					return String(str || '').charAt(0).toUpperCase() + str.slice(1).toLowerCase();
				}

				if (theme) {
					document.documentElement.classList.add('theme' + ucFirst(theme));
				}

				var bgColor = theme === 'dark' ? '#171717' : '#fff';
				document.body.style.backgroundColor = bgColor;
			})();
		</script>

		<script type="module" src="/src/ts/entry.web.tsx"></script>
	</body>
</html>
